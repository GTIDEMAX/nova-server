# Configuración de despliegue para Render (https://render.com)
# Render lee este archivo y crea el servicio del Agente Social automáticamente.
# Las variables con "sync: false" NO se ponen aquí (son secretas): las escribes
# en el panel de Render al desplegar. Sin ellas, el agente arranca en modo demo.
services:
  - type: web
    name: agente-social
    runtime: node
    plan: free
    rootDir: agente-social
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      # IA de texto (Claude) — pon tu clave para textos reales
      - key: ANTHROPIC_API_KEY
        sync: false
      # IA de imagenes (OpenAI gpt-image-1) — pon tu clave para generar imagenes
      - key: IMAGE_API_KEY
        sync: false
      # URL publica de la app (para publicar imagenes generadas desde el programador)
      - key: PUBLIC_BASE_URL
        sync: false
      # Meta (Instagram + Facebook)
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PAGE_ID
        sync: false
      - key: META_IG_USER_ID
        sync: false
      # WhatsApp Cloud API
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      # Web / blog (opcional)
      - key: WEB_PUBLISH_WEBHOOK
        sync: false
      # Cada cuánto revisa el programador (ms). 60000 = 1 minuto
      - key: SCHEDULER_INTERVAL_MS
        value: "60000"

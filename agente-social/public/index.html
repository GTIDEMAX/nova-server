<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agente Social · Panel</title>
<style>
  :root {
    --bg: #0f1220; --panel: #181c2e; --panel2: #202542; --line: #2c3255;
    --txt: #e8eaf5; --muted: #9aa0c0; --acc: #6d5efc; --acc2: #22c9a8;
    --warn: #f5a524; --danger: #f43f5e; --ok: #22c9a8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--txt); }
  header { padding: 18px 24px; background: linear-gradient(90deg,#181c2e,#1d2140); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
  .logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg,var(--acc),var(--acc2)); display: grid; place-items: center; font-weight: 800; }
  .badge { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .badge.on { color: var(--ok); border-color: var(--ok); }
  .badge.off { color: var(--warn); border-color: var(--warn); }
  .badge.warn { color: var(--warn); border-color: var(--warn); background: rgba(255,200,0,.08); }
  nav { display: flex; gap: 6px; padding: 12px 24px 0; flex-wrap: wrap; }
  nav button { background: transparent; border: none; color: var(--muted); padding: 10px 16px; border-radius: 10px 10px 0 0; cursor: pointer; font-size: 14px; font-weight: 600; }
  nav button.active { background: var(--panel); color: var(--txt); }
  main { padding: 20px 24px 60px; max-width: 1100px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  h2 { font-size: 16px; margin: 0 0 14px; }
  h3 { font-size: 14px; margin: 0 0 6px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--txt); border-radius: 9px; padding: 10px 12px; font-size: 14px; font-family: inherit; }
  textarea { resize: vertical; min-height: 70px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .chip { font-size: 12px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; user-select: none; color: var(--muted); }
  .chip.sel { background: var(--acc); border-color: var(--acc); color: #fff; }
  button.btn, a.btn { background: var(--acc); color: #fff; border: none; padding: 10px 16px; border-radius: 9px; font-weight: 600; cursor: pointer; font-size: 14px; margin-top: 12px; }
  button.btn.sec { background: var(--panel2); border: 1px solid var(--line); }
  button.btn.ok, a.btn.ok { background: var(--ok); }
  button.btn.warn { background: var(--warn); color: #201a00; }
  button.btn.danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
  button.btn.mini, a.btn.mini { padding: 6px 10px; font-size: 12px; margin: 0; }
  .item { border: 1px solid var(--line); border-radius: 11px; padding: 14px; margin-bottom: 10px; background: var(--panel2); }
  .item .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .tag { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: #2a2f52; color: var(--muted); text-transform: capitalize; }
  .estado { font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
  .e-borrador { background: #33385e; color: #b9c0ee; }
  .e-aprobado { background: #204a44; color: #7ff0d6; }
  .e-programado { background: #4a3d1a; color: #ffd98a; }
  .e-publicado { background: #1f3f66; color: #8fc4ff; }
  .e-fallido { background: #4a2130; color: #ff9db0; }
  .e-pendiente { background: #4a2130; color: #ffb3c4; }
  .e-respondido { background: #204a44; color: #7ff0d6; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .muted { color: var(--muted); font-size: 13px; }
  .empty { text-align: center; color: var(--muted); padding: 30px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--acc); color: #fff; padding: 12px 20px; border-radius: 10px; opacity: 0; transition: .3s; pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; }
  .flex-b { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  small.hs { color: var(--acc2); }
  /* Reportes: stat tiles + barras */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill,minmax(150px,1fr)); gap: 12px; }
  .tile { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .tile .n { font-size: 30px; font-weight: 800; line-height: 1.1; }
  .tile .l { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .tile .n.ok { color: var(--ok); } .tile .n.warn { color: var(--warn); } .tile .n.acc { color: #8f86ff; }
  .bars { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .bar-row { display: grid; grid-template-columns: 110px 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
  .bar-row .cap { color: var(--muted); text-transform: capitalize; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { background: var(--panel2); border-radius: 6px; height: 16px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--acc); border-radius: 6px; min-width: 3px; }
  .bar-row .val { font-weight: 700; font-variant-numeric: tabular-nums; }
  .spark { display: flex; align-items: flex-end; gap: 6px; height: 90px; margin-top: 8px; }
  .spark .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; justify-content: flex-end; }
  .spark .sb { width: 100%; max-width: 34px; background: var(--acc2); border-radius: 5px 5px 0 0; min-height: 3px; }
  .spark .sl { font-size: 10px; color: var(--muted); }
  .spark .sv { font-size: 11px; font-weight: 700; }
</style>
</head>
<body>
<header>
  <div class="logo">AS</div>
  <h1>Agente Social</h1>
  <span id="iaBadge" class="badge">IA…</span>
  <span class="badge" id="empBadge">0 empresas</span>
  <span class="badge" id="dbBadge">…</span>
</header>

<nav>
  <button data-tab="empresas" class="active">🏢 Empresas</button>
  <button data-tab="contenido">✍️ Crear contenido</button>
  <button data-tab="aprobaciones">📅 Publicaciones</button>
  <button data-tab="atencion">💬 Atención al cliente</button>
  <button data-tab="clientes">🔋 Clientes</button>
  <button data-tab="spots">🎙️ Spots</button>
  <button data-tab="web">🌐 Mi web</button>
  <button data-tab="reportes">📊 Reportes</button>
</nav>

<main>
  <section id="tab-empresas"></section>
  <section id="tab-contenido" hidden></section>
  <section id="tab-aprobaciones" hidden></section>
  <section id="tab-atencion" hidden></section>
  <section id="tab-clientes" hidden></section>
  <section id="tab-spots" hidden></section>
  <section id="tab-web" hidden></section>
  <section id="tab-reportes" hidden></section>
</main>

<div id="toast" class="toast"></div>

<script>
const PLATAFORMAS = ['instagram','facebook','linkedin','tiktok','web','blog'];
let S = { empresas: [], publicaciones: [], mensajes: [], iaActiva: false, modelo: '' };

// ---------- helpers ----------
const $ = (s, r=document) => r.querySelector(s);
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2200); }
async function api(url, opts) {
  const r = await fetch(url, { headers: {'Content-Type':'application/json'}, ...opts });
  const data = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(data.error || 'Error');
  return data;
}
function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function nombreEmpresa(id){ const e = S.empresas.find(x=>x.id===id); return e ? e.nombre : '—'; }

async function cargar() {
  S = await api('/api/estado');
  const b = $('#iaBadge');
  b.textContent = S.iaActiva ? 'IA activa · '+S.modelo : 'Modo demo (sin ANTHROPIC_API_KEY)';
  b.className = 'badge ' + (S.iaActiva ? 'on' : 'off');
  const db = $('#dbBadge');
  if (db) {
    db.textContent = S.datos === 'mongo' ? '💾 Datos guardados' : '⚠️ Datos temporales';
    db.className = 'badge ' + (S.datos === 'mongo' ? 'on' : 'off');
    db.title = S.datos === 'mongo' ? 'Conectado a MongoDB: no se pierde nada' : 'Sin base de datos: se borra al reiniciar el servidor';
    db.style.cursor = 'pointer';
    db.onclick = () => alert(S.datos === 'mongo' ? '💾 Base de datos MongoDB conectada. Tus datos ya no se borran.' : '⚠️ Los datos son temporales.\n\nMotivo: ' + (S.datosMotivo || 'desconocido'));
  }
  $('#empBadge').textContent = S.empresas.length + ' empresa' + (S.empresas.length===1?'':'s');
  render();
}

// ---------- tabs ----------
let tab = 'empresas';
document.querySelectorAll('nav button').forEach(btn => btn.onclick = () => {
  tab = btn.dataset.tab;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b===btn));
  ['empresas','contenido','aprobaciones','atencion','clientes','spots','web','reportes'].forEach(t => $('#tab-'+t).hidden = t!==tab);
  render();
});

function render() {
  if (tab==='empresas') renderEmpresas();
  if (tab==='contenido') renderContenido();
  if (tab==='aprobaciones') renderAprobaciones();
  if (tab==='atencion') renderAtencion();
  if (tab==='clientes') renderClientes();
  if (tab==='spots') renderSpots();
  if (tab==='web') renderWeb();
  if (tab==='reportes') renderReportes();
}

// ---------- EMPRESAS ----------
function renderEmpresas() {
  const c = $('#tab-empresas');
  c.innerHTML = '';
  const form = el(`<div class="card">
    <h2>Registrar empresa / marca</h2>
    <div class="row">
      <div><label>Nombre</label><input id="e-nombre" placeholder="Ej: Panadería La Espiga"></div>
      <div><label>Rubro</label><input id="e-rubro" placeholder="Ej: alimentos, moda, servicios"></div>
    </div>
    <div class="row">
      <div><label>Tono de comunicación</label><input id="e-tono" placeholder="cercano y profesional"></div>
      <div><label>Público objetivo</label><input id="e-publico" placeholder="Ej: familias del barrio"></div>
    </div>
    <label>Plataformas que maneja</label>
    <div class="chips" id="e-plats"></div>
    <div class="row">
      <div><label>WhatsApp Phone ID <small class="hs">(opcional)</small></label><input id="e-wa" placeholder="Id del número de WhatsApp Business"></div>
      <div><label>Auto-responder WhatsApp</label><select id="e-auto"><option value="">No — yo apruebo antes de enviar</option><option value="1">Sí — responder solo con IA</option></select></div>
    </div>
    <button class="btn" id="e-guardar">Guardar empresa</button>
  </div>`);
  c.appendChild(form);
  const platsSel = new Set();
  const cont = $('#e-plats', form);
  PLATAFORMAS.forEach(p => {
    const chip = el(`<span class="chip">${p}</span>`);
    chip.onclick = () => { chip.classList.toggle('sel'); platsSel.has(p)?platsSel.delete(p):platsSel.add(p); };
    cont.appendChild(chip);
  });
  $('#e-guardar', form).onclick = async () => {
    const nombre = $('#e-nombre', form).value.trim();
    if (!nombre) return toast('Pon un nombre');
    await api('/api/empresas', { method:'POST', body: JSON.stringify({
      nombre, rubro: $('#e-rubro',form).value, tono: $('#e-tono',form).value,
      publico: $('#e-publico',form).value, plataformas: [...platsSel],
      whatsappPhoneId: $('#e-wa',form).value, autoResponder: !!$('#e-auto',form).value
    })});
    toast('Empresa guardada'); cargar();
  };

  if (!S.empresas.length) { c.appendChild(el('<div class="empty">Aún no tienes empresas. Registra la primera arriba.</div>')); return; }
  S.empresas.forEach(e => {
    const item = el(`<div class="item">
      <div class="top"><h3>${esc(e.nombre)}</h3><span class="tag">${esc(e.rubro||'sin rubro')}</span></div>
      <div class="muted">Tono: ${esc(e.tono)} · Público: ${esc(e.publico||'—')}</div>
      <div class="chips">${(e.plataformas||[]).map(p=>`<span class="chip sel">${p}</span>`).join('') || '<span class="muted">sin plataformas</span>'}</div>
      ${e.autoResponder?'<div class="muted" style="margin-top:6px">🤖 Auto-respuesta de WhatsApp activada</div>':''}
      <div class="muted meta-con" style="margin-top:6px">${e.metaPageId
        ? `📡 Publica en: <b>Facebook ${esc(e.metaPageNombre||e.metaPageId)}</b>${e.metaIgId ? ` · <b>Instagram @${esc(e.metaIgUsuario||e.metaIgId)}</b>` : ' · <span style="color:var(--warn)">sin Instagram ligado</span>'}`
        : '📡 Facebook/Instagram: sin conectar (publica de práctica)'}</div>
      <div class="acciones"><button class="btn sec mini b-meta">📡 ${e.metaPageId?'Cambiar':'Conectar'} Facebook/Instagram</button><button class="btn danger mini">Eliminar</button></div>
    </div>`);
    $('.b-meta', item).onclick = async () => {
      let l;
      try { l = await api('/api/meta/paginas'); } catch (err) { return toast(err.message); }
      if (!l.ok) return alert('No se pudo leer tus páginas.\n\n' + (l.detalle || ''));
      if (!l.paginas.length) return alert('Tu token de Meta no tiene páginas. Revisa que el usuario del sistema tenga asignadas tus páginas.');
      const zona = $('.meta-con', item);
      zona.innerHTML = '';
      const sel = el(`<select><option value="">— Sin conectar —</option>${l.paginas.map((p,i)=>`<option value="${i}" ${p.id===e.metaPageId?'selected':''}>${esc(p.nombre)}${p.igUsuario?' · IG @'+esc(p.igUsuario):' · (sin Instagram)'}</option>`).join('')}</select>`);
      const ok = el('<button class="btn ok mini" style="margin-top:8px">Guardar</button>');
      ok.onclick = async () => {
        const p = sel.value === '' ? { id:'', nombre:'', igId:'', igUsuario:'' } : l.paginas[+sel.value];
        try { await api('/api/empresas/'+e.id, { method:'PATCH', body: JSON.stringify({ metaPageId:p.id, metaPageNombre:p.nombre, metaIgId:p.igId, metaIgUsuario:p.igUsuario }) }); }
        catch (err) { return toast('⚠️ No se guardó: ' + err.message); }
        toast(p.id ? 'Conectada a ' + p.nombre + ' ✅' : 'Desconectada'); cargar();
      };
      zona.appendChild(el('<div style="margin-bottom:6px">Escoge la página de <b>'+esc(e.nombre)+'</b>:</div>'));
      zona.appendChild(sel); zona.appendChild(ok);
    };
    $('.danger', item).onclick = async () => { if(confirm('¿Eliminar '+e.nombre+' y todo su contenido?')){ await api('/api/empresas/'+e.id,{method:'DELETE'}); cargar(); } };
    c.appendChild(item);
  });
}

// ---------- CREAR CONTENIDO ----------
const formContenido = {}; // lo elegido sobrevive a la recarga automatica
function renderContenido() {
  const c = $('#tab-contenido'); c.innerHTML = '';
  if (!S.empresas.length) { c.appendChild(el('<div class="empty">Primero registra una empresa en la pestaña Empresas.</div>')); return; }
  const form = el(`<div class="card">
    <h2>Generar contenido con IA</h2>
    <div class="row">
      <div><label>Empresa</label><select id="g-emp">${S.empresas.map(e=>`<option value="${e.id}">${esc(e.nombre)}</option>`).join('')}</select></div>
      <div><label>Plataforma</label><select id="g-plat">${PLATAFORMAS.map(p=>`<option>${p}</option>`).join('')}</select></div>
      <div><label>Cantidad</label><select id="g-cant"><option>3</option><option>1</option><option>2</option><option>4</option><option>5</option></select></div>
    </div>
    <label>Tema / idea (opcional)</label>
    <textarea id="g-tema" placeholder="Ej: promoción de fin de semana 2x1, lanzamiento de producto nuevo, consejos útiles..."></textarea>
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer">
      <input type="checkbox" id="g-img" ${S.imagenActiva?'checked':''} ${S.imagenActiva?'':'disabled'} style="width:auto">
      🎨 Crear también la imagen con IA ${S.imagenActiva?'':'<small class="hs">(activa IMAGE_API_KEY para usarlo)</small>'}
    </label>
    <button class="btn" id="g-go">✨ Generar borradores</button>
    <div id="g-status" class="muted" style="margin-top:10px"></div>
  </div>`);
  c.appendChild(form);
  ['g-emp','g-plat','g-cant','g-tema'].forEach(id => {
    const campo = $('#'+id, form);
    if (formContenido[id] !== undefined && [...(campo.options||[{value:formContenido[id]}])].some(o=>o.value===formContenido[id])) campo.value = formContenido[id];
    campo.addEventListener('input', () => { formContenido[id] = campo.value; });
    campo.addEventListener('change', () => { formContenido[id] = campo.value; });
  });
  $('#g-go', form).onclick = async () => {
    const btn = $('#g-go', form); btn.disabled = true;
    const conImagen = $('#g-img',form) && $('#g-img',form).checked;
    $('#g-status', form).textContent = conImagen ? 'Generando texto e imágenes con IA… (las imágenes tardan un poco más)' : 'Generando con IA… (puede tardar unos segundos)';
    try {
      const r = await api('/api/contenido/generar', { method:'POST', body: JSON.stringify({
        empresaId: $('#g-emp',form).value, plataforma: $('#g-plat',form).value,
        cantidad: $('#g-cant',form).value, tema: $('#g-tema',form).value, conImagen })});
      toast('Se crearon '+r.publicaciones.length+' borradores');
      cargar();
    } catch(e){ toast('Error: '+e.message); $('#g-status',form).textContent=''; }
    btn.disabled = false;
  };
  // Muestra últimos borradores creados
  const borradores = S.publicaciones.filter(p=>p.estado==='borrador').slice(-6).reverse();
  if (borradores.length) {
    c.appendChild(el('<h3 style="margin:6px 4px">Últimos borradores</h3>'));
    borradores.forEach(p => c.appendChild(tarjetaPublicacion(p)));
  }
}

// ---------- PUBLICACIONES / APROBACIONES ----------
function tarjetaPublicacion(p) {
  const item = el(`<div class="item">
    <div class="top">
      <div><span class="estado e-${p.estado}">${p.estado}</span> <span class="tag">${p.plataforma}</span> <span class="muted">${esc(nombreEmpresa(p.empresaId))}</span></div>
    </div>
    <textarea class="p-texto">${esc(p.texto)}</textarea>
    <label>Hashtags <small class="muted">(sepáralos con espacios)</small></label>
    <input class="p-tags" placeholder="#GtideMexico #Navidad" value="${esc((p.hashtags||[]).join(' '))}">
    ${p.video?`<video src="/api/videos/${esc(p.video.archivo)}" controls playsinline preload="metadata" style="width:100%;max-height:420px;border-radius:10px;margin-top:8px;background:#000"></video><div class="muted" style="margin-top:4px">🎬 ${p.plataforma==='instagram'?'Se publica como Reel':'Video'} · ${esc(p.video.nombre||'')} · ${((p.video.bytes||0)/1048576).toFixed(1)} MB</div>`:''}
    ${!p.video && p.imagenUrl?`<img src="${esc(p.imagenUrl)}" alt="" style="width:100%;max-height:320px;object-fit:cover;border-radius:10px;margin-top:8px">${p.imagenIA?(p.imagenOriginal?'<div class="muted" style="margin-top:4px">🎨 Foto mejorada con IA · revisa que el producto se vea igual al real</div>':'<div class="muted" style="margin-top:4px">🎨 Imagen sugerida por IA · para el producto real, sube tu foto</div>'):''}`:''}
    ${p.video?'':`<label>URL de imagen ${(p.plataforma==='instagram')?'<small class="hs">(obligatoria en Instagram)</small>':'(opcional)'}</label>
    <input class="p-img" placeholder="https://…/imagen.jpg" value="${esc(p.imagenUrl||'')}">`}
    ${p.estado!=='publicado'?`<label>Programar para (fecha y hora)</label><input type="datetime-local" class="p-fecha" value="${esc(p.fechaProgramada||'')}">`:''}
    <div class="acciones"></div>
    ${p.fechaProgramada && p.estado==='programado'?`<div class="muted" style="margin-top:6px">📅 Se publicará automáticamente el ${esc(p.fechaProgramada.replace('T',' '))}</div>`:''}
    ${p.ultimoError?`<div class="muted" style="margin-top:6px">⚠️ ${esc(p.ultimoError)} ${p.intentos?`(intentos: ${p.intentos})`:''}</div>`:''}
    ${p.publicadoPor==='programador'?`<div class="muted" style="margin-top:4px">🤖 Publicado automáticamente por el programador</div>`:''}
    ${p.resultadoPublicacion?`<div class="muted" style="margin-top:6px">${!p.resultadoPublicacion.ok?'🔴 ':p.resultadoPublicacion.simulado?'🟡 ':'🟢 '}${esc(p.resultadoPublicacion.nota||'Publicado')}</div>`:''}
  </div>`);
  const acc = $('.acciones', item);
  const guardarTexto = async () => api('/api/publicaciones/'+p.id, {method:'PATCH', body: JSON.stringify({texto: $('.p-texto',item).value, hashtags: $('.p-tags',item).value.split(/[\s,]+/).filter(Boolean).map(h => h.startsWith('#') ? h : '#'+h), ...($('.p-img',item) ? {imagenUrl: $('.p-img',item).value} : {})})});

  const bGuardar = el('<button class="btn sec mini">Guardar cambios</button>');
  bGuardar.onclick = async () => { await guardarTexto(); toast('Guardado'); };
  acc.appendChild(bGuardar);

  // Subir foto desde el celular (cámara o galería)
  const inpFoto = el('<input type="file" accept="image/*" capture="environment" style="display:none">');
  const bFoto = el('<button class="btn sec mini">📷 Subir foto</button>');
  bFoto.onclick = () => inpFoto.click();
  inpFoto.onchange = () => {
    const f = inpFoto.files[0]; if (!f) return;
    if (f.size > 10*1024*1024) return toast('Foto muy grande (máx 10MB)');
    const reader = new FileReader();
    reader.onload = async () => {
      bFoto.disabled = true; bFoto.textContent = '📷 Subiendo…';
      try { await guardarTexto(); await api('/api/publicaciones/'+p.id+'/foto',{method:'POST',body:JSON.stringify({data:reader.result})}); toast('Foto subida ✅'); cargar(); }
      catch(e){ toast('Error: '+e.message); bFoto.disabled=false; bFoto.textContent='📷 Subir foto'; }
    };
    reader.readAsDataURL(f);
  };
  if (!p.video) { acc.appendChild(bFoto); acc.appendChild(inpFoto); }

  // Traer imagen desde un enlace (de su página o internet)
  const bLink = el('<button class="btn sec mini">🔗 Traer de un enlace</button>');
  bLink.onclick = async () => {
    const u = prompt('Pega el enlace (URL) de la imagen — de tu página o de internet:');
    if (!u) return;
    bLink.disabled = true; bLink.textContent = '🔗 Trayendo…';
    try { await guardarTexto(); await api('/api/publicaciones/'+p.id+'/imagen-url',{method:'POST',body:JSON.stringify({url:u.trim()})}); toast('Imagen lista ✅'); cargar(); }
    catch(e){ toast(e.message); bLink.disabled=false; bLink.textContent='🔗 Traer de un enlace'; }
  };
  if (!p.video) acc.appendChild(bLink);

  if (S.imagenActiva && !p.video) {
    const bImg = el('<button class="btn sec mini">🎨 '+(p.imagenOriginal||(p.imagenUrl&&!p.imagenIA)?(p.imagenIA?'Otra foto pro':'Foto pro con IA'):(p.imagenUrl?'Regenerar imagen IA':'Generar imagen IA'))+'</button>');
    bImg.onclick = async () => { bImg.disabled=true; bImg.textContent='🎨 Creando…'; try{ await guardarTexto(); await api('/api/publicaciones/'+p.id+'/imagen',{method:'POST'}); toast('Imagen creada'); cargar(); }catch(e){ toast('Error: '+e.message); bImg.disabled=false; } };
    acc.appendChild(bImg);
  }

  if (p.estado==='borrador') {
    const b = el('<button class="btn ok mini">✓ Aprobar</button>');
    b.onclick = async () => { await guardarTexto(); await api('/api/publicaciones/'+p.id,{method:'PATCH',body:JSON.stringify({accion:'aprobar'})}); toast('Aprobado'); cargar(); };
    acc.appendChild(b);
  }
  if (p.estado!=='publicado') {
    const b = el('<button class="btn warn mini">📅 '+(p.estado==='programado'?'Reprogramar':'Programar')+'</button>');
    b.onclick = async () => { const f = $('.p-fecha',item).value; if(!f) return toast('Elige fecha y hora arriba'); await guardarTexto(); await api('/api/publicaciones/'+p.id,{method:'PATCH',body:JSON.stringify({accion:'programar',fecha:f})}); toast('Programado ✅ Se publicará solo'); cargar(); };
    acc.appendChild(b);
  }
  if (p.estado!=='publicado') {
    const b = el('<button class="btn mini">🚀 Publicar ahora</button>');
    b.onclick = async () => { await guardarTexto(); const r = await api('/api/publicaciones/'+p.id+'/publicar',{method:'POST'}); toast(r.resultado.ok ? (r.resultado.simulado?'⚠️ No se publicó: falta conectar la cuenta':'Publicado ✅') : ('⚠️ '+(r.resultado.nota||'Error'))); cargar(); };
    acc.appendChild(b);
  }
  const bDel = el('<button class="btn danger mini">Eliminar</button>');
  bDel.onclick = async () => { await api('/api/publicaciones/'+p.id,{method:'DELETE'}); cargar(); };
  acc.appendChild(bDel);
  return item;
}

    $('.v-go', vCard).onclick = async () => {

  const waCard = el(`<div class="card"><div class="flex-b"><h3>📱 Conexión con WhatsApp</h3><span class="badge" id="wa-badge">comprobando…</span></div><div class="muted" id="wa-detalle" style="margin-top:6px"></div></div>`);

function tarjetaMensaje(m) {
  const item = el(`<div class="item">
    <div class="top"><div><span class="estado e-${m.estado}">${m.estado}</span> <span class="tag">${m.canal}</span> ${m.auto?'<span class="tag">🤖 auto</span>':''} <span class="muted">${esc(nombreEmpresa(m.empresaId))}</span></div><span class="muted">${esc(m.cliente)}${m.telefono?' · '+esc(m.telefono):''}</span></div>
    <div style="margin:4px 0 10px"><small class="hs">Cliente:</small><div>${esc(m.texto)}</div></div>
    <label>Respuesta (borrador de la IA — edítala si quieres)</label>
    <textarea class="m-resp">${esc(m.respuestaBorrador)}</textarea>
    <div class="acciones"></div>
  </div>`);
  const acc = $('.acciones', item);
  if (m.estado==='pendiente') {
    const bEnv = el('<button class="btn ok mini">✓ Aprobar y enviar</button>');
    bEnv.onclick = async () => { const r = await api('/api/mensajes/'+m.id+'/responder',{method:'POST',body:JSON.stringify({respuesta:$('.m-resp',item).value})}); toast(!r.envio.ok?'⚠️ '+(r.envio.nota||'No se envió'):r.envio.simulado?'No se envió (modo simulado)':'Enviado'); cargar(); };
    acc.appendChild(bEnv);
    const bReg = el('<button class="btn sec mini">↻ Regenerar</button>');
    bReg.onclick = async () => { toast('Regenerando…'); await api('/api/mensajes/'+m.id+'/regenerar',{method:'POST'}); cargar(); };
    acc.appendChild(bReg);
  }
  const bDel = el('<button class="btn danger mini">Eliminar</button>');
  bDel.onclick = async () => { await api('/api/mensajes/'+m.id,{method:'DELETE'}); cargar(); };
  acc.appendChild(bDel);
  return item;
}

// ---------- CLIENTES Y RECORDATORIOS DE BATERÍA ----------
async function renderClientes() {
  const c = $('#tab-clientes');
  if (!S.empresas.length) { c.innerHTML = ''; c.appendChild(el('<div class="empty">Primero registra una empresa.</div>')); return; }
  let datos, hoy;
  try { [datos, hoy] = await Promise.all([api('/api/clientes'), api('/api/recordatorios/hoy')]); }
  catch (e) { c.innerHTML = ''; c.appendChild(el('<div class="empty">No se pudieron cargar los clientes.</div>')); return; }
  c.innerHTML = '';

  const m = datos.modo, env = m.envio || {}, bot = env.bot || {};
  const etiqueta = m.auto ? 'Automático' : (m.bot ? 'Bot' : '1-toque');
  const hace = (iso) => { const min = Math.round((Date.now() - new Date(iso)) / 60000); return min < 1 ? 'hace un momento' : min < 60 ? `hace ${min} min` : `hace ${Math.round(min / 60)} h`; };
  const botTxt = !bot.configurado ? 'sin configurar' : bot.conectado ? `conectado ✅ (revisó ${hace(bot.ultimaConsulta)})` : bot.ultimaConsulta ? `desconectado ⚠️ (última vez ${hace(bot.ultimaConsulta)})` : 'esperando a que se conecte';
  const espera = env.esperaHasta ? ` Siguiente envío a las ${new Date(env.esperaHasta).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' })}` : '';
  c.appendChild(el(`<div class="card"><div class="flex-b"><h3>🔋 Recordatorios de batería</h3>
    <span class="badge ${m.auto || m.bot ? 'on' : 'off'}">${etiqueta}</span></div>

  const hoyCard = el(`<div class="card"><h2>📲 Para enviar hoy (${hoy.pendientes.length})</h2><div></div></div>`);
  const lista = hoyCard.lastElementChild;
  if (!hoy.pendientes.length) lista.appendChild(el('<div class="muted">Nada pendiente hoy 🎉</div>'));

      try { await api(`/api/recordatorios/${p.clienteId}/${p.recordatorioId}/enviado`, { method: 'POST' }); toast('Marcado como enviado ✅'); renderClientes(); }
      catch (e) { toast(e.message); }

    bOmit.onclick = async () => { await api(`/api/recordatorios/${p.clienteId}/${p.recordatorioId}/omitir`, { method: 'POST' }); toast('Omitido'); renderClientes(); };

    lista.appendChild(item);

  c.appendChild(hoyCard);

    <h2>➕ Registrar venta</h2>
    <p class="muted">Al guardar, el agente programa los recordatorios de cuidado según la batería: plomo (recarga mensual, siempre llena) o litio (media carga si se guarda).</p>
    <div class="row">
      <div><label>Empresa</label><select id="k-emp">${S.empresas.map(e => `<option value="${e.id}">${esc(e.nombre)}</option>`).join('')}</select></div>

    </div>
    <div class="row">
      <div><label>Nombre del cliente</label><input id="k-nombre" placeholder="Ej: Juan Pérez"></div>
      <div><label>WhatsApp (10 dígitos)</label><input id="k-tel" inputmode="numeric" placeholder="Ej: 2411234567"></div>
    </div>
    <div class="row">
      <div><label>Producto / modelo</label><input id="k-prod" placeholder="Ej: scooter eléctrico"></div>
      <div><label>Batería</label><select id="k-bat"><option value="plomo">Plomo</option><option value="litio">Litio (patines)</option></select></div>
    </div>
    <label style="display:flex;gap:8px;align-items:flex-start;margin-top:12px;cursor:pointer;font-size:13px;color:var(--txt)">
      <input type="checkbox" id="k-ok" style="width:auto;margin-top:2px"> El cliente aceptó recibir recordatorios por WhatsApp
    </label>
    <button class="btn" id="k-guardar">Guardar y programar recordatorios</button>
  </div>`);

      await api('/api/clientes', { method: 'POST', body: JSON.stringify({
        empresaId: $('#k-emp', form).value, fechaCompra: $('#k-fecha', form).value, nombre: $('#k-nombre', form).value,
        telefono: $('#k-tel', form).value, producto: $('#k-prod', form).value, tipoBateria: $('#k-bat', form).value,
        consentimiento: $('#k-ok', form).checked }) });
      toast('Cliente guardado ✅ Recordatorios programados'); renderClientes();
    } catch (e) { toast(e.message); }
  };
  c.appendChild(form);

  // Lista de clientes
  const lst = el(`<div class="card"><h2>👥 Clientes (${datos.clientes.length})</h2><div></div></div>`);
  const kl = lst.lastElementChild;
  if (!datos.clientes.length) kl.appendChild(el('<div class="muted">Aún no hay clientes registrados.</div>'));
  datos.clientes.slice().reverse().forEach(k => {
    const prox = k.proximo ? new Date(k.proximo).toLocaleDateString('es') : '—';
    const it = el(`<div class="item">
      <div class="top"><div><b>${esc(k.nombre)}</b> <span class="tag">${esc(k.tipoBateria)}</span> ${k.activo ? '' : '<span class="estado e-fallido">pausado</span>'}</div><span class="muted">+${esc(k.telefono)}</span></div>
      <div class="muted">${esc(k.producto)} · ${esc(nombreEmpresa(k.empresaId))} · compró el ${new Date(k.fechaCompra).toLocaleDateString('es')}</div>
      <div class="muted">Recordatorios enviados: ${k.enviados}/${k.total} · Próximo: ${k.activo ? prox : '—'}${k.bajaPor === 'cliente' ? ' · pidió BAJA' : ''}</div>
      <div class="acciones"></div></div>`);
    const acc = $('.acciones', it);
    const bP = el(`<button class="btn sec mini">${k.activo ? '⏸️ Pausar' : '▶️ Reactivar'}</button>`);
    bP.onclick = async () => { await api('/api/clientes/' + k.id, { method: 'PATCH', body: JSON.stringify({ activo: !k.activo }) }); renderClientes(); };
    const bD = el('<button class="btn danger mini">Eliminar</button>');
    bD.onclick = async () => { if (confirm('¿Eliminar a ' + k.nombre + '?')) { await api('/api/clientes/' + k.id, { method: 'DELETE' }); renderClientes(); } };
    acc.appendChild(bP); acc.appendChild(bD);
    kl.appendChild(it);
  });
  c.appendChild(lst);
}

// ---------- SPOTS (audio con ElevenLabs) ----------
const FORMATOS_SPOT = { spot: '📻 Spot (30 s, una voz)', dialogo: '🎭 Diálogo (2 voces)', bocina: '🔊 Bocina para la tienda (cápsulas, ~6 min)' };
const ESTILOS_LECTURA = { emocionado: '🔥 Emocionado', amigable: '😊 Amigable', serio: '🎩 Serio', dramatico: '🎬 Dramático' };
const MUSICAS = ['reggaetón actual', 'cumbia moderna', 'regional mexicano / corridos', 'electro latino', 'pop alegre', 'navideña con energía', 'épica / de película', 'rock con energía'];
let VOCES = null;
let spotsPoll = null;

async function cargarVoces() {
  if (VOCES) return VOCES;
  try { const r = await api('/api/spots/voces'); VOCES = r.ok && r.voces.length ? r.voces : null; } catch (e) { VOCES = null; }
  return VOCES || [{ id: 'JjHBC66wF58p4ogebCNA', nombre: 'Eduardo (voz comercial)', idioma: 'es', genero: 'hombre', descripcion: '', muestra: '' }];
}
function opcionesVoz(voces, sel) {
  return voces.map(v => `<option value="${esc(v.id)}" ${v.id === sel ? 'selected' : ''}>${esc(v.nombre)}${v.genero ? ' · ' + v.genero : ''}${v.idioma && v.idioma !== 'es' ? ' · ' + v.idioma : ''}</option>`).join('');
}
function oirVoz(voces, id) {
  const v = voces.find(x => x.id === id);
  if (!v || !v.muestra) return toast('Esta voz no tiene muestra');
  new Audio(v.muestra).play().catch(() => toast('No se pudo reproducir la muestra'));
}

async function renderSpots() {
  const c = $('#tab-spots');
  if (!S.empresas.length) { c.innerHTML = ''; c.appendChild(el('<div class="empty">Primero registra una empresa.</div>')); return; }
  let datos;
  try { datos = await api('/api/spots'); } catch (e) { c.innerHTML = ''; c.appendChild(el('<div class="empty">No se pudieron cargar los spots.</div>')); return; }
  const voces = await cargarVoces();
  const vozDef = datos.vozDefault;
  c.innerHTML = '';

  c.appendChild(el(`<div class="card"><div class="flex-b"><h3>🎙️ Spots de audio</h3>
    <span class="badge ${datos.eleven ? 'on' : 'off'}">${datos.eleven ? 'ElevenLabs conectado' : 'Falta ElevenLabs'}</span></div>
    <div class="muted" style="margin-top:6px">${datos.eleven
      ? 'Tú das la idea, la IA escribe el guion, tú lo editas y escoges las voces. Luego el sistema graba, pone música y te da el MP3 listo.'
      : 'Para producir audio agrega <b>ELEVENLABS_API_KEY</b> en Render → Environment. Mientras, ya puedes escribir y editar guiones.'}</div></div>`));

  // Nuevo spot
  const form = el(`<div class="card"><h2>➕ Nuevo spot</h2>
    <div class="row">
      <div><label>Empresa</label><select id="s-emp">${S.empresas.map(e => `<option value="${e.id}">${esc(e.nombre)}</option>`).join('')}</select></div>
      <div><label>Formato</label><select id="s-formato">${Object.entries(FORMATOS_SPOT).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
    </div>
    <div class="row">
      <div><label>Voz principal</label><div style="display:flex;gap:6px"><select id="s-vozA">${opcionesVoz(voces, vozDef)}</select><button class="btn sec mini" id="s-oirA" title="Oír muestra">▶</button></div></div>
      <div id="s-vozB-box"><label id="s-vozB-label">Segunda voz</label><div style="display:flex;gap:6px"><select id="s-vozB">${opcionesVoz(voces, (voces.find(v => v.id !== vozDef && v.idioma === 'es') || {}).id)}</select><button class="btn sec mini" id="s-oirB" title="Oír muestra">▶</button></div></div>
    </div>
    <label>Música de fondo</label><select id="s-musica">${MUSICAS.map(m => `<option>${m}</option>`).join('')}</select>
    <label>Idea del spot (pon aquí los datos reales: promo, precios, teléfono, redes…)</label>
    <textarea id="s-idea" placeholder="Ej: Buen Fin en VOLTUM: scooters y motos eléctricas, apartado hasta 3 meses, meses con tarjeta, regalo sorpresa. WhatsApp 241 339 1574. Tiendas en Apizaco y Tlaxco."></textarea>
    <div class="acciones"><button class="btn" id="s-ia">✨ Que la IA escriba el guion</button><button class="btn sec" id="s-manual">✍️ Escribirlo yo</button></div>
  </div>`);
  c.appendChild(form);
  const fmt = $('#s-formato', form);
  const ajustarB = () => {
    $('#s-vozB-box', form).style.display = fmt.value === 'spot' ? 'none' : '';
    $('#s-vozB-label', form).textContent = fmt.value === 'bocina' ? 'Voz para los tips' : 'Voz del personaje B';
  };
  fmt.onchange = ajustarB; ajustarB();
  $('#s-oirA', form).onclick = () => oirVoz(voces, $('#s-vozA', form).value);
  $('#s-oirB', form).onclick = () => oirVoz(voces, $('#s-vozB', form).value);
  const crear = async (manual, btn) => {
    btn.disabled = true; const t = btn.textContent; btn.textContent = manual ? 'Creando…' : '✨ Escribiendo guion… (unos segundos)';
    try {
      await api('/api/spots', { method: 'POST', body: JSON.stringify({
        empresaId: $('#s-emp', form).value, formato: fmt.value, estiloMusica: $('#s-musica', form).value,
        vozA: $('#s-vozA', form).value, vozB: fmt.value === 'spot' ? '' : $('#s-vozB', form).value,
        idea: $('#s-idea', form).value, manual,
      }) });
      toast(manual ? 'Spot en blanco creado ✍️' : 'Guion listo ✅ Revísalo y edítalo abajo');
      renderSpots();
    } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = t; }
  };
  $('#s-ia', form).onclick = (ev) => crear(false, ev.target);
  $('#s-manual', form).onclick = (ev) => crear(true, ev.target);

  // Lista
  const lista = el(`<div class="card"><h2>🎧 Tus spots (${datos.spots.length})</h2><div></div></div>`);
  const cont = lista.lastElementChild;
  if (!datos.spots.length) cont.appendChild(el('<div class="muted">Aún no tienes spots. Crea el primero arriba.</div>'));
  datos.spots.forEach(sp => cont.appendChild(tarjetaSpot(sp, voces, datos.eleven)));
  c.appendChild(lista);

  // Si hay alguno produciéndose, revisa cada 5 s solo esas tarjetas
  clearTimeout(spotsPoll);
  if (datos.spots.some(sp => sp.estado === 'produciendo')) spotsPoll = setTimeout(pollSpots, 5000);
}

async function pollSpots() {
  if (tab !== 'spots') return;
  let datos; try { datos = await api('/api/spots'); } catch (e) { spotsPoll = setTimeout(pollSpots, 8000); return; }
  const voces = await cargarVoces();
  let siguen = false;
  datos.spots.forEach(sp => {
    const vieja = document.querySelector(`[data-spot="${sp.id}"]`);
    if (!vieja) return;
    if (sp.estado === 'produciendo') {
      siguen = true;
      const p = vieja.querySelector('.sp-progreso'); if (p) p.textContent = '⏳ ' + (sp.progreso || 'Produciendo…');
    } else if (vieja.dataset.estado === 'produciendo') {
      vieja.replaceWith(tarjetaSpot(sp, voces, datos.eleven));
      toast(sp.estado === 'listo' ? '🎧 ¡Spot listo! Dale play' : '❌ Hubo un error al producir');
    }
  });
  if (siguen) spotsPoll = setTimeout(pollSpots, 5000);
}

function tarjetaSpot(sp, voces, eleven) {
  const empresa = nombreEmpresa(sp.empresaId);
  const produciendo = sp.estado === 'produciendo';
  const badge = { borrador: ['off', '✏️ Borrador'], produciendo: ['warn', '⏳ Produciendo'], listo: ['on', '🎧 Listo'], error: ['off', '❌ Error'] }[sp.estado] || ['off', sp.estado];
  const item = el(`<div class="item" data-spot="${sp.id}" data-estado="${sp.estado}">
    <div class="top"><div><input class="sp-titulo" value="${esc(sp.titulo || '')}" style="font-weight:700;font-size:15px" ${produciendo ? 'disabled' : ''}></div>
      <span class="badge ${badge[0]}">${badge[1]}</span></div>
    <div class="muted" style="margin:6px 0">${esc(empresa)} · ${FORMATOS_SPOT[sp.formato] || sp.formato}${sp.duracion ? ' · ' + Math.round(sp.duracion) + ' s' : ''}</div>
    ${sp.estado === 'listo' && sp.audio ? `<audio controls preload="none" style="width:100%;margin:6px 0" src="/api/spots/${sp.id}/audio?v=${sp.version || 1}"></audio>
      <div><a class="btn ok mini" style="text-decoration:none;display:inline-block" href="/api/spots/${sp.id}/audio?descargar=1">⬇️ Descargar MP3</a></div>` : ''}
    ${produciendo ? `<div class="sp-progreso" style="margin:8px 0;color:var(--warn)">⏳ ${esc(sp.progreso || 'Produciendo…')} (tarda 1 a 3 minutos)</div>` : ''}
    ${sp.estado === 'error' ? `<div style="margin:8px 0;color:var(--danger)">❌ ${esc(sp.error || 'Error')}</div>` : ''}
    <details ${sp.estado === 'borrador' || sp.estado === 'error' ? 'open' : ''} style="margin-top:8px"><summary style="cursor:pointer;color:var(--muted)">✏️ Guion, voces y música (editable)</summary>
      <div class="sp-lineas"></div>
      <button class="btn sec mini sp-add" style="margin-top:8px" ${produciendo ? 'disabled' : ''}>➕ Agregar línea</button>
      <label style="display:flex;gap:8px;align-items:center;margin-top:14px;cursor:pointer;color:var(--txt);font-size:13px"><input type="checkbox" class="sp-conmusica" style="width:auto" ${sp.conMusica !== false ? 'checked' : ''} ${produciendo ? 'disabled' : ''}> Con música de fondo</label>
      <label>Descripción de la música (en inglés; la IA ya la llenó, puedes cambiarla)</label>
      <textarea class="sp-musica" style="min-height:50px" ${produciendo ? 'disabled' : ''}>${esc(sp.musicaPrompt || '')}</textarea>
    </details>
    <div class="acciones">
      <button class="btn sec mini sp-guardar" ${produciendo ? 'disabled' : ''}>💾 Guardar cambios</button>
      <button class="btn ok mini sp-producir" ${produciendo || !eleven ? 'disabled' : ''} title="${eleven ? 'Gasta créditos de ElevenLabs (voz + música)' : 'Falta ELEVENLABS_API_KEY'}">🎙️ ${sp.estado === 'listo' ? 'Volver a producir' : 'Producir audio'}</button>
      <button class="btn danger mini sp-borrar" ${produciendo ? 'disabled' : ''}>Eliminar</button>
    </div>
  </div>`);

  const cont = $('.sp-lineas', item);
  const filaLinea = (l) => {
    const f = el(`<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px">
      <div class="row" style="align-items:flex-end">
        <div><label>Voz</label><div style="display:flex;gap:6px"><select class="l-voz">${opcionesVoz(voces, l.vozId)}</select><button class="btn sec mini l-oir" title="Oír muestra">▶</button></div></div>
        <div><label>Cómo lo dice</label><select class="l-estilo">${Object.entries(ESTILOS_LECTURA).map(([k, v]) => `<option value="${k}" ${k === (l.estilo || 'emocionado') ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
        ${sp.formato === 'bocina' ? `<div style="max-width:150px"><label>Tipo</label><select class="l-tipo"><option value="venta" ${l.tipo !== 'tip' ? 'selected' : ''}>📣 Venta</option><option value="tip" ${l.tipo === 'tip' ? 'selected' : ''}>💡 Tip</option></select></div>` : ''}
        <div style="flex:0;min-width:auto"><button class="btn danger mini l-quitar" title="Quitar línea">✕</button></div>
      </div>
      <textarea class="l-texto" style="margin-top:8px" placeholder="Lo que dice el locutor…">${esc(l.texto || '')}</textarea>
    </div>`);
    f.dataset.personaje = l.personaje || 'A';
    $('.l-oir', f).onclick = () => oirVoz(voces, $('.l-voz', f).value);
    $('.l-quitar', f).onclick = () => f.remove();
    if (produciendo) f.querySelectorAll('select,textarea,button').forEach(x => x.disabled = true);
    cont.appendChild(f);
  };
  (sp.capsulas || []).forEach(filaLinea);
  $('.sp-add', item).onclick = () => {
    const filas = cont.children; const ult = filas[filas.length - 1];
    filaLinea({ texto: '', vozId: ult ? $('.l-voz', ult).value : (voces[0] || {}).id, estilo: 'emocionado', tipo: 'venta' });
  };

  const datosEditados = () => ({
    titulo: $('.sp-titulo', item).value,
    musicaPrompt: $('.sp-musica', item).value,
    conMusica: $('.sp-conmusica', item).checked,
    capsulas: [...cont.children].map(f => ({
      texto: $('.l-texto', f).value, vozId: $('.l-voz', f).value, estilo: $('.l-estilo', f).value,
      tipo: $('.l-tipo', f) ? $('.l-tipo', f).value : 'venta', personaje: f.dataset.personaje,
    })),
  });
  $('.sp-guardar', item).onclick = async () => {
    try { await api('/api/spots/' + sp.id, { method: 'PATCH', body: JSON.stringify(datosEditados()) }); toast('Cambios guardados 💾'); }
    catch (e) { toast(e.message); }
  };
  $('.sp-producir', item).onclick = async () => {
    const d = datosEditados();
    if (!d.capsulas.some(x => x.texto.trim())) return toast('Escribe al menos una línea');
    if (!confirm('¿Producir el audio? Gasta créditos de tu plan de ElevenLabs (voces' + (d.conMusica ? ' + música' : '') + ').')) return;
    try {
      await api('/api/spots/' + sp.id, { method: 'PATCH', body: JSON.stringify(d) });
      await api('/api/spots/' + sp.id + '/producir', { method: 'POST' });
      toast('🎙️ Produciendo… te aviso cuando esté listo');
      renderSpots();
    } catch (e) { toast(e.message); }
  };
  $('.sp-borrar', item).onclick = async () => {
    if (!confirm('¿Eliminar "' + (sp.titulo || 'este spot') + '"?')) return;
    await api('/api/spots/' + sp.id, { method: 'DELETE' }); renderSpots();
  };
  return item;
}

// ---------- REPORTES ----------
function barras(cont, datos) {
  // datos: [[etiqueta, valor], ...] — barras de una sola tonalidad con etiqueta directa
  const max = Math.max(1, ...datos.map(d => d[1]));
  const wrap = el('<div class="bars"></div>');
  if (!datos.length) { cont.appendChild(el('<div class="muted">Sin datos todavía.</div>')); return; }
  datos.forEach(([cap, val]) => {
    const row = el(`<div class="bar-row"><span class="cap">${esc(cap)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(val/max*100)}%"></div></div><span class="val">${val}</span></div>`);
    wrap.appendChild(row);
  });
  cont.appendChild(wrap);
}

async function renderReportes() {
  const c = $('#tab-reportes'); c.innerHTML = '';
  const head = el(`<div class="card"><div class="flex-b"><h2>Reportes</h2>
    <select id="r-emp" style="max-width:220px">
      <option value="">Todas las empresas</option>
      ${S.empresas.map(e=>`<option value="${e.id}">${esc(e.nombre)}</option>`).join('')}
    </select></div></div>`);
  c.appendChild(head);
  const cont = el('<div></div>'); c.appendChild(cont);

  const pintar = async () => {
    const eid = $('#r-emp', head).value;
    const m = await api('/api/metricas' + (eid?('?empresaId='+eid):''));
    cont.innerHTML = '';

    // KPIs
    const kpis = el('<div class="card"><h3>Resumen</h3><div class="tiles"></div></div>');
    const tiles = $('.tiles', kpis);
    const tile = (n, l, cls) => el(`<div class="tile"><div class="n ${cls||''}">${n}</div><div class="l">${l}</div></div>`);
    if (!eid) tiles.appendChild(tile(m.empresas, 'Empresas'));
    tiles.appendChild(tile(m.publicaciones.publicado, 'Publicadas', 'ok'));
    tiles.appendChild(tile(m.publicaciones.programado, 'Programadas', 'acc'));
    tiles.appendChild(tile(m.publicaciones.total, 'Contenido creado'));
    tiles.appendChild(tile(m.mensajes.total, 'Mensajes recibidos'));
    tiles.appendChild(tile(m.mensajes.pendientes, 'Sin responder', m.mensajes.pendientes?'warn':'ok'));
    tiles.appendChild(tile(m.mensajes.porcentajeRespuesta+'%', 'Tasa de respuesta', 'ok'));
    if (m.publicaciones.fallido) tiles.appendChild(tile(m.publicaciones.fallido, 'Fallidas', 'warn'));
    cont.appendChild(kpis);

    // Actividad 7 días
    const act = el('<div class="card"><h3>Publicaciones (últimos 7 días)</h3><div class="spark"></div></div>');
    const sp = $('.spark', act);
    const maxA = Math.max(1, ...m.actividad7dias.map(d=>d.publicadas));
    m.actividad7dias.forEach(d => {
      sp.appendChild(el(`<div class="col"><span class="sv">${d.publicadas||''}</span><div class="sb" style="height:${Math.round(d.publicadas/maxA*70)}px" title="${d.publicadas}"></div><span class="sl">${esc(d.fecha)}</span></div>`));
    });
    cont.appendChild(act);

    // Publicadas por plataforma
    const plat = el('<div class="card"><h3>Publicadas por plataforma</h3></div>');
    barras(plat, Object.entries(m.porPlataforma).sort((a,b)=>b[1]-a[1]));
    cont.appendChild(plat);

    // Estado del contenido
    const est = el('<div class="card"><h3>Estado del contenido</h3></div>');
    const P = m.publicaciones;
    barras(est, [['borrador',P.borrador],['aprobado',P.aprobado],['programado',P.programado],['publicado',P.publicado],['fallido',P.fallido]].filter(x=>x[1]>0));
    cont.appendChild(est);

    // Mensajes por canal
    const can = el('<div class="card"><h3>Mensajes por canal</h3></div>');
    barras(can, Object.entries(m.porCanal).sort((a,b)=>b[1]-a[1]));
    cont.appendChild(can);

    // Por empresa (solo vista general)
    if (!eid && m.porEmpresa.length) {
      const pe = el('<div class="card"><h3>Actividad por empresa (publicaciones)</h3></div>');
      barras(pe, m.porEmpresa.map(e=>[e.nombre, e.publicadas]).sort((a,b)=>b[1]-a[1]));
      cont.appendChild(pe);
    }

    // Descargar reporte
    const dl = el('<div class="card"><button class="btn sec" id="r-dl">⬇️ Descargar reporte (.txt)</button> <span class="muted">Las métricas de alcance/likes aparecerán aquí cuando conectes las cuentas de cada red.</span></div>');
    cont.appendChild(dl);
    $('#r-dl', dl).onclick = () => descargarReporte(eid ? nombreEmpresa(eid) : 'Todas las empresas', m);
  };
  $('#r-emp', head).onchange = pintar;
  pintar();
}

function descargarReporte(titulo, m) {
  const L = [];
  L.push('REPORTE — ' + titulo);
  L.push('Generado: ' + new Date().toLocaleString('es'));
  L.push('');
  L.push('CONTENIDO');
  L.push('  Total creado: ' + m.publicaciones.total);
  L.push('  Publicadas: ' + m.publicaciones.publicado);
  L.push('  Programadas: ' + m.publicaciones.programado);
  L.push('  Borradores: ' + m.publicaciones.borrador);
  L.push('  Fallidas: ' + m.publicaciones.fallido);
  L.push('');
  L.push('PUBLICADAS POR PLATAFORMA');
  Object.entries(m.porPlataforma).forEach(([k,v])=>L.push('  '+k+': '+v));
  L.push('');
  L.push('ATENCIÓN AL CLIENTE');
  L.push('  Mensajes recibidos: ' + m.mensajes.total);
  L.push('  Respondidos: ' + m.mensajes.respondidos);
  L.push('  Pendientes: ' + m.mensajes.pendientes);
  L.push('  Tasa de respuesta: ' + m.mensajes.porcentajeRespuesta + '%');
  const blob = new Blob([L.join('\n')], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'reporte-'+titulo.replace(/\s+/g,'_')+'.txt'; a.click();
  toast('Reporte descargado');
}

cargar();

// Auto-actualiza cada 20s para reflejar publicaciones automaticas,
// sin molestar si estas escribiendo en un campo.
setInterval(() => {
  const a = document.activeElement;
  if (a && ['INPUT','TEXTAREA','SELECT'].includes(a.tagName)) return;
  // Recargar redibuja todo: no borrar lo que se escribio y aun no se guarda
  if ([...document.querySelectorAll('section:not([hidden]) textarea, section:not([hidden]) input:not([type=file])')].some(x => x.value !== x.defaultValue && !x.id.startsWith('g-'))) return;
  cargar();
}, 20000);
</script>
